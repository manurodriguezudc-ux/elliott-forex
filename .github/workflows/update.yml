name: Actualizar velas Forex H1 H4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'snapshot.mjs'
      - '.github/workflows/update.yml'
      - 'fetch.mjs'
  schedule:
    # Doble comprobación antes de cada informe por si GitHub retrasa una ejecución.
    - cron: '20,40 8,13,20 * * 1-5'
      timezone: 'Europe/Madrid'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: elliott-pages
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Descargar OHLC de Dukascopy y preparar informes
        run: npm run update
      - name: Exportar velas a GitHub para ChatGPT
        run: node snapshot.mjs
      - name: Guardar datos OHLC en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualizar OHLC H1/H4 [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir páginas estáticas
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Publicar páginas
        id: deploy
        uses: actions/deploy-pages@v4
